name: b2r CI

# b2r is a lightweight posts + chat app built on the Jetchat Compose base.
# CI assembles the debug APK and uploads it as an artifact for on-device testing.

on:
  push:
    branches:
      - claude/primal-android-fork-decon-zf1ynu
  pull_request:
    branches:
      - claude/primal-android-fork-decon-zf1ynu
  workflow_dispatch:

concurrency:
  group: b2r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: b2r-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Faithful UI preview: render the real composables to PNG on the JVM
      # (Roborazzi + Robolectric, no emulator) and publish them as an artifact.
      - name: Render screenshots
        run: ./gradlew recordRoborazziDebug --stacktrace

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b2r-screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: error
