name: b2r CI

# Verification pipeline for the b2r vivisection. The KMP/Android build cannot be
# checked in the dev container (no Android SDK), so each sprint commit is
# compile-verified here. Targets the AOSP flavour (b2r is Google/Firebase-free
# by design); a placeholder google-services.json is generated because the
# upstream google-services plugin is still applied and would otherwise fail.

on:
  push:
    branches:
      - claude/primal-android-fork-decon-zf1ynu
  pull_request:
    branches:
      - claude/primal-android-fork-decon-zf1ynu
  workflow_dispatch:

concurrency:
  group: b2r-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate placeholder google-services.json
        run: |
          mkdir -p app/src/aosp app/src/google
          cat > /tmp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "b2r-placeholder",
              "storage_bucket": "b2r-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "net.primal.android" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholderplaceholderplaceholder1234" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cp /tmp/google-services.json app/src/aosp/google-services.json
          cp /tmp/google-services.json app/src/google/google-services.json

      - name: Compile AOSP debug (verify vivisection compiles)
        run: ./gradlew compileAospDebugKotlin --stacktrace

  detekt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate placeholder google-services.json
        run: |
          mkdir -p app/src/aosp app/src/google
          cat > /tmp/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "b2r-placeholder",
              "storage_bucket": "b2r-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "net.primal.android" }
                },
                "oauth_client": [],
                "api_key": [ { "current_key": "placeholderplaceholderplaceholder1234" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          cp /tmp/google-services.json app/src/aosp/google-services.json
          cp /tmp/google-services.json app/src/google/google-services.json

      - name: Run detekt
        run: ./gradlew detekt --stacktrace
